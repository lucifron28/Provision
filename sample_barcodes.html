<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Provision — Philippine Supermarket Sample Barcodes</title>
    <!-- JsBarcode library for rendering crisp EAN-13 and UPC barcodes -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --bg-color: #FAF7F2;
            --surface-color: #FFFFFF;
            --green: #336142;
            --text-primary: #1F2421;
            --text-secondary: #5C635F;
            --border-color: #E2DDD5;
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
        }

        .header {
            max-width: 1200px;
            margin: 0 auto 32px auto;
            text-align: center;
        }

        .header h1 {
            font-family: Georgia, serif;
            font-size: 32px;
            color: var(--green);
            margin-bottom: 8px;
        }

        .header p {
            font-size: 15px;
            color: var(--text-secondary);
            margin-top: 0;
        }

        .badge-info {
            display: inline-block;
            background-color: #E7EFE9;
            color: var(--green);
            font-size: 13px;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .category-title {
            grid-column: 1 / -1;
            font-family: Georgia, serif;
            font-size: 22px;
            font-weight: bold;
            color: var(--green);
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 8px;
            margin-top: 24px;
        }

        .barcode-card {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px 16px;
            text-align: center;
            box-shadow: var(--card-shadow);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
        }

        .product-name {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .product-meta {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 16px;
        }

        .svg-container {
            background: #FFFFFF;
            padding: 10px;
            border-radius: 8px;
            display: inline-block;
        }

        svg {
            max-width: 100%;
            height: auto;
        }
    </style>
</head>
<body>

    <div class="header">
        <span class="badge-info">Provision Household Inventory System</span>
        <h1>Philippine Supermarket Barcodes</h1>
        <p>Point your iPhone camera at any barcode below in the <strong>Scan</strong> tab to test rapid barcode recognition, quantity intake, and FEFO tracking.</p>
    </div>

    <div class="grid" id="barcode-grid">
        <!-- Injected via JavaScript -->
    </div>

    <script>
        const products = [
            // Canned Goods
            { category: "Canned Goods", name: "Century Tuna Flakes in Oil", brand: "Century Tuna", barcode: "4800016644818", format: "EAN13" },
            { category: "Canned Goods", name: "Century Tuna Hot & Spicy", brand: "Century Tuna", barcode: "4800016644825", format: "EAN13" },
            { category: "Canned Goods", name: "Purefoods Corned Beef Classic", brand: "Purefoods", barcode: "4800361389440", format: "EAN13" },
            { category: "Canned Goods", name: "San Marino Corned Tuna", brand: "San Marino", barcode: "4800110025421", format: "EAN13" },
            { category: "Canned Goods", name: "Mega Sardines in Tomato Sauce", brand: "Mega Sardines", barcode: "4800168100217", format: "EAN13" },
            { category: "Canned Goods", name: "CDO Karne Norte", brand: "CDO", barcode: "4800888139580", format: "EAN13" },
            { category: "Canned Goods", name: "Argentina Corned Beef", brand: "Argentina", barcode: "4800110014029", format: "EAN13" },
            { category: "Canned Goods", name: "Spam Luncheon Meat Classic", brand: "SPAM", barcode: "037600104616", format: "UPC" },

            // Noodles & Quick Meals
            { category: "Noodles & Quick Meals", name: "Pancit Canton Kalamansi", brand: "Lucky Me!", barcode: "4800361005210", format: "EAN13" },
            { category: "Noodles & Quick Meals", name: "Pancit Canton Chilimansi", brand: "Lucky Me!", barcode: "4800361005319", format: "EAN13" },
            { category: "Noodles & Quick Meals", name: "Pancit Canton Extra Hot Chili", brand: "Lucky Me!", barcode: "4800361005418", format: "EAN13" },
            { category: "Noodles & Quick Meals", name: "Nissin Cup Noodles Seafood", brand: "Nissin", barcode: "4800016053016", format: "EAN13" },

            // Dairy & Chilled
            { category: "Dairy & Chilled", name: "Magnolia Fresh Milk 1L", brand: "Magnolia", barcode: "4800110041117", format: "EAN13" },
            { category: "Dairy & Chilled", name: "Eden Original Cheese Melt", brand: "Eden", barcode: "4800016021114", format: "EAN13" },
            { category: "Dairy & Chilled", name: "Nestlé All-Purpose Cream", brand: "Nestlé", barcode: "7613035612118", format: "EAN13" },
            { category: "Dairy & Chilled", name: "Bounty Fresh Farm Eggs (12s)", brand: "Bounty Fresh", barcode: "4800999000042", format: "EAN13" },

            // Condiments & Seasonings
            { category: "Condiments & Seasonings", name: "Datu Puti Soy Sauce 1L", brand: "Datu Puti", barcode: "4801981110010", format: "EAN13" },
            { category: "Condiments & Seasonings", name: "Datu Puti White Vinegar 1L", brand: "Datu Puti", barcode: "4801981120019", format: "EAN13" },
            { category: "Condiments & Seasonings", name: "Silver Swan Soy Sauce 1L", brand: "Silver Swan", barcode: "4800038101115", format: "EAN13" },
            { category: "Condiments & Seasonings", name: "Knorr Sinigang sa Sampalok Original", brand: "Knorr", barcode: "4800888121110", format: "EAN13" },
            { category: "Condiments & Seasonings", name: "Mang Tomas All-Around Sarsa", brand: "Mang Tomas", barcode: "4801668201019", format: "EAN13" },

            // Snacks & Bakery
            { category: "Snacks & Bakery", name: "Gardenia Classic White Bread", brand: "Gardenia", barcode: "4806500800018", format: "EAN13" },
            { category: "Snacks & Bakery", name: "SkyFlakes Crackers Tub", brand: "M.Y. San", barcode: "4800016001017", format: "EAN13" },
            { category: "Snacks & Bakery", name: "Piattos Cheese Flavored Crisps", brand: "Jack 'n Jill", barcode: "4800016601019", format: "EAN13" },
            { category: "Snacks & Bakery", name: "Kopiko Blanca 3-in-1 Coffee", brand: "Kopiko", barcode: "8996001414002", format: "EAN13" },

            // Beverages
            { category: "Beverages", name: "San Miguel Pale Pilsen 330mL", brand: "San Miguel", barcode: "4800010111118", format: "EAN13" },
            { category: "Beverages", name: "C2 Cool & Clean Green Tea Apple", brand: "C2", barcode: "4800016777110", format: "EAN13" },
            { category: "Beverages", name: "Royal Tru-Orange 1.5L", brand: "Royal", barcode: "4800001112225", format: "EAN13" }
        ];

        const grid = document.getElementById("barcode-grid");
        let currentCategory = "";

        products.forEach((prod, index) => {
            if (prod.category !== currentCategory) {
                currentCategory = prod.category;
                const catHeader = document.createElement("div");
                catHeader.className = "category-title";
                catHeader.innerText = currentCategory;
                grid.appendChild(catHeader);
            }

            const card = document.createElement("div");
            card.className = "barcode-card";

            const info = document.createElement("div");
            info.innerHTML = `
                <div class="product-name">${prod.name}</div>
                <div class="product-meta">${prod.brand} • ${prod.barcode}</div>
            `;
            card.appendChild(info);

            const svgContainer = document.createElement("div");
            svgContainer.className = "svg-container";
            const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            svg.id = `barcode-${index}`;
            svgContainer.appendChild(svg);
            card.appendChild(svgContainer);

            grid.appendChild(card);

            try {
                JsBarcode(`#barcode-${index}`, prod.barcode, {
                    format: prod.format,
                    lineColor: "#111111",
                    width: 2,
                    height: 80,
                    displayValue: true,
                    fontSize: 14,
                    font: "monospace"
                });
            } catch (err) {
                console.error("Barcode generation error:", prod.barcode, err);
            }
        });
    </script>
</body>
</html>
