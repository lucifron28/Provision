name: Optional DeepSeek live smoke

on:
  workflow_dispatch:
    inputs:
      run_live_smoke:
        description: Send one bounded test prompt to the configured DeepSeek provider
        type: boolean
        required: true
        default: false

jobs:
  live-smoke:
    if: ${{ inputs.run_live_smoke }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Sync backend environment
        working-directory: backend
        run: uv sync --frozen
      - name: Check whether the provider secret is available
        id: provider-secret
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -n "$DEEPSEEK_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "DeepSeek live smoke skipped because DEEPSEEK_API_KEY is not configured."
          fi
      - name: Run one bounded live provider request
        if: steps.provider-secret.outputs.available == 'true'
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_ENABLED: "true"
          DEEPSEEK_REQUEST_BUDGET: "1"
          DEEPSEEK_REQUESTS_PER_MINUTE: "1"
          DEEPSEEK_MAX_OUTPUT_TOKENS: "128"
          JWT_SECRET_KEY: test-secret-key-for-live-smoke-only
        run: uv run python scripts/deepseek_live_smoke.py
