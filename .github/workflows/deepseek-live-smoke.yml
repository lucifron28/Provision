name: Optional DeepSeek live recipe smoke

on:
  push:
    branches:
      - feat/cook-with-pip-ios-m1

permissions:
  contents: read

concurrency:
  group: deepseek-live-recipe-smoke
  cancel-in-progress: false

jobs:
  live-recipe:
    if: >-
      github.event.before == '153859d34366ce4e53004f4614fb46c468db9c37' &&
      github.event.head_commit.message == 'Run approved DeepSeek recipe smoke once' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: provision
          POSTGRES_DB: provision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision_test
      TEST_DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision_test
      JWT_SECRET_KEY: test-secret-key-for-live-smoke-only
      DEEPSEEK_ENABLED: "true"
      DEEPSEEK_TIMEOUT_SECONDS: "45"
      DEEPSEEK_REQUEST_BUDGET: "1"
      DEEPSEEK_HOUSEHOLD_REQUEST_BUDGET: "1"
      DEEPSEEK_REQUESTS_PER_MINUTE: "1"
      DEEPSEEK_MAX_OUTPUT_TOKENS: "512"
      PROVISION_DEEPSEEK_LIVE_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Sync backend environment
        working-directory: backend
        run: uv sync --frozen
      - name: Prepare live test evidence folder
        run: mkdir -p artifacts
      - name: Check provider secret without exposing its value
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          if [ -z "$DEEPSEEK_API_KEY" ]; then
            echo "DEEPSEEK_API_KEY is not configured."
            exit 1
          fi
          echo "DEEPSEEK_API_KEY is configured."
      - name: Generate one synthetic recipe through FastAPI
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PROVISION_DEEPSEEK_LIVE_EVIDENCE_PATH: ../artifacts/deepseek-live-evidence.json
        run: >-
          uv run pytest -q -s
          tests/test_deepseek_live_smoke.py::test_live_generation_api_with_consented_test_household
          --junitxml=../artifacts/deepseek-live-junit.xml
      - name: Upload sanitized live test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-live-recipe-evidence
          path: artifacts/
          if-no-files-found: warn
