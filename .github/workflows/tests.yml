name: Provision tests

on:
  push:
    branches: [main, fix/apple-design-ux-refinement, feat/adaptive-appearance-ux-pip, feat/complete-ui-ux-refinement, feat/cook-with-pip-ios-m1]
  pull_request:
    branches: [main]

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulator runtimes
        run: xcodebuild -version && xcrun simctl list devices available
      - name: Prepare iOS test artifact folder
        run: mkdir -p artifacts
      - name: Run iOS XCTest and UI screenshot suite
        run: >-
          xcodebuild test
          -project frontend/frontend.xcodeproj
          -scheme frontend
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -resultBundlePath artifacts/frontend.xcresult
          CODE_SIGNING_ALLOWED=NO
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d artifacts/frontend.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path artifacts/frontend.xcresult \
              --output-path artifacts/cook-with-pip-screenshots
          else
            echo "No xcresult bundle was produced."
          fi
      - name: Verify screenshot attachments
        if: always()
        run: |
          if [ -d artifacts/frontend.xcresult ]; then
            count=$(find artifacts/cook-with-pip-screenshots -type f -iname '*.png' 2>/dev/null | wc -l | tr -d ' ')
            echo "Exported screenshot count: ${count:-0}"
            test "${count:-0}" -ge 5
          fi
      - name: Upload iOS screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-ios-test-results
          path: |
            artifacts/frontend.xcresult
            artifacts/cook-with-pip-screenshots
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: provision
          POSTGRES_DB: provision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision
      TEST_DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision_test
      JWT_SECRET_KEY: test-secret-key-for-ci-only-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Create dedicated test database
        env:
          PGPASSWORD: provision
        run: createdb -h localhost -U provision provision_test
      - name: Run Alembic migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
