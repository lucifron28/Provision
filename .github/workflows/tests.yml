name: Provision tests

on:
  push:
    branches: [main, fix/apple-design-ux-refinement, feat/adaptive-appearance-ux-pip, feat/complete-ui-ux-refinement]
  pull_request:
    branches: [main]

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulator runtimes
        run: xcodebuild -version && xcrun simctl list devices available
      - name: Run scanner XCTest suite
        run: >-
          xcodebuild test
          -project frontend/frontend.xcodeproj
          -scheme frontend
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          CODE_SIGNING_ALLOWED=NO

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: provision
          POSTGRES_DB: provision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision
      TEST_DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision_test
      JWT_SECRET_KEY: test-secret-key-for-ci-only-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Create dedicated test database
        env:
          PGPASSWORD: provision
        run: createdb -h localhost -U provision provision_test
      - name: Run Alembic migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
