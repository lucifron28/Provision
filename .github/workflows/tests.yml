name: Provision tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulator runtimes
        run: xcodebuild -version && xcrun simctl list devices available
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Prepare iOS test artifact folder
        run: mkdir -p artifacts/raw-cook-with-pip-screenshots artifacts/cook-with-pip-screenshots
      - name: Run focused Cook with Pip relaunch test
        id: focused-ios-tests
        run: >-
          xcodebuild test
          -project frontend/frontend.xcodeproj
          -scheme frontend
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -only-testing:frontendUITests/CookWithPipUITests/testAmbiguousShoppingConfirmationSurvivesAppRelaunch
          -resultBundlePath artifacts/cook-with-pip-restart.xcresult
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_IDENTITY=-
      - name: Run iOS XCTest and UI screenshot suite
        id: ios-tests
        if: ${{ !cancelled() }}
        run: >-
          xcodebuild test
          -project frontend/frontend.xcodeproj
          -scheme frontend
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
          -resultBundlePath artifacts/frontend.xcresult
          CODE_SIGNING_ALLOWED=YES
          CODE_SIGN_IDENTITY=-
      - name: Export simulator screenshots
        if: always()
        run: |
          if [ -d artifacts/frontend.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path artifacts/frontend.xcresult \
              --output-path artifacts/raw-cook-with-pip-screenshots
          else
            echo "No xcresult bundle was produced." >&2
            exit 1
          fi
      - name: Organize and verify required screenshot scenarios
        if: always()
        run: >-
          python .github/scripts/organize_ios_screenshots.py
          --input artifacts/raw-cook-with-pip-screenshots
          --output artifacts/cook-with-pip-screenshots
          --required .github/scripts/required_ios_screenshots.json
          --commit-sha "$GITHUB_SHA"
          --test-outcome "$(if [[ '${{ steps.focused-ios-tests.outcome }}' == 'success' && '${{ steps.ios-tests.outcome }}' == 'success' ]]; then echo success; else echo failure; fi)"
      - name: Package screenshots for visual review
        if: always()
        run: |
          if [ -d artifacts/cook-with-pip-screenshots ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              artifacts/cook-with-pip-screenshots \
              artifacts/cook-with-pip-visual-review.zip
          else
            echo "Organized screenshot folder is missing." >&2
            exit 1
          fi
      - name: Upload screenshot review archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-visual-review
          path: artifacts/cook-with-pip-visual-review.zip
          if-no-files-found: error
      - name: Upload organized iOS screenshots and scenario manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-ios-screenshots
          path: artifacts/cook-with-pip-screenshots
          if-no-files-found: error
      - name: Upload iOS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-xcresult
          path: artifacts/frontend.xcresult
          if-no-files-found: error
      - name: Upload focused relaunch test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-focused-relaunch-xcresult
          path: artifacts/cook-with-pip-restart.xcresult
          if-no-files-found: warn

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: provision
          POSTGRES_PASSWORD: provision
          POSTGRES_DB: provision
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision
      TEST_DATABASE_URL: postgresql+psycopg://provision:provision@localhost:5432/provision_test
      JWT_SECRET_KEY: test-secret-key-for-ci-only-never-use-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"
      - name: Create dedicated test database
        env:
          PGPASSWORD: provision
        run: createdb -h localhost -U provision provision_test
      - name: Run Alembic migrations
        working-directory: backend
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head
          uv run alembic check
      - name: Prepare backend test artifact folder
        run: mkdir -p artifacts
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest --junitxml=../artifacts/backend-junit.xml
      - name: Upload backend test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: artifacts/backend-junit.xml
          if-no-files-found: warn
