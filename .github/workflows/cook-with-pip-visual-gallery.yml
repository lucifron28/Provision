name: Cook with Pip visual gallery
run-name: Cook with Pip visual gallery (${{ github.event.inputs.suite || 'full-gallery' }})

on:
  workflow_dispatch:
    inputs:
      force:
        description: Rerun the complete gallery even if this commit already has a successful gallery run
        required: false
        type: boolean
        default: false
      suite:
        description: Run a focused regression suite, or the complete 55-scenario gallery
        required: true
        type: choice
        options:
          - full-gallery
          - toggle-regressions
          - shopping-recovery
        default: full-gallery
  schedule:
    - cron: '30 6 * * 1'

permissions:
  actions: read
  contents: read

concurrency:
  group: cook-with-pip-gallery-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  duplicate-check:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Skip a duplicate successful gallery for this commit
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const suite = context.eventName === "workflow_dispatch"
              ? context.payload.inputs?.suite || "full-gallery"
              : "full-gallery";
            if (suite !== "full-gallery") {
              core.setOutput("skip", "false");
              core.info(`Running focused suite ${suite}; this does not count as a full gallery.`);
              return;
            }
            const force = context.eventName === "workflow_dispatch"
              && context.payload.inputs?.force === "true";
            if (force) {
              core.setOutput("skip", "false");
              core.info("Manual force input requested a fresh gallery run.");
              return;
            }
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "cook-with-pip-visual-gallery.yml",
              head_sha: context.sha,
              per_page: 100,
            });
            const priorSuccess = data.workflow_runs.find(run => {
              const isFocused = ["toggle-regressions", "shopping-recovery"]
                .some(suite => run.display_title?.includes(`(${suite})`) ?? false);
              return run.id !== context.runId
                && run.status === "completed"
                && run.conclusion === "success"
                && !isFocused;
            });
            core.setOutput("skip", priorSuccess ? "true" : "false");
            if (priorSuccess) core.info(`Gallery already passed for this commit in run ${priorSuccess.id}.`);

  ios-gallery:
    needs: [duplicate-check]
    if: needs.duplicate-check.outputs.skip != 'true'
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and simulator runtimes
        run: xcodebuild -version && xcrun simctl list devices available
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install screenshot validation dependency
        run: python -m pip install --disable-pip-version-check Pillow
      - name: Test screenshot organizer with synthetic PNG fixtures
        run: python -m unittest discover -s .github/scripts/tests -p "test_*.py"
      - name: Prepare screenshot artifact folders
        run: mkdir -p artifacts/raw-cook-with-pip-screenshots artifacts/cook-with-pip-screenshots
      - name: Run selected iOS XCUITest suite
        id: ios-tests
        env:
          GALLERY_SUITE: ${{ github.event.inputs.suite || 'full-gallery' }}
        run: |
          set -o pipefail
          common_args=(
            -project frontend/frontend.xcodeproj
            -scheme frontend
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest'
            -resultBundlePath artifacts/frontend.xcresult
          )
          if [[ "$GALLERY_SUITE" == "toggle-regressions" ]]; then
            xcodebuild test "${common_args[@]}" \
              -only-testing:frontendUITests/CookWithPipUITests/testPipChatConsentControlsGallery \
              -only-testing:frontendUITests/CookWithPipUITests/testShoppingPreviewEditsConsolidationAndExplicitConfirmation \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              2>&1 | tee artifacts/xcodebuild.log
          elif [[ "$GALLERY_SUITE" == "shopping-recovery" ]]; then
            xcodebuild test "${common_args[@]}" \
              -only-testing:frontendUITests/CookWithPipUITests/testShoppingOfflineRetryAndStalePreviewRecovery \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              2>&1 | tee artifacts/xcodebuild.log
          else
            xcodebuild test "${common_args[@]}" \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGN_IDENTITY=- \
              2>&1 | tee artifacts/xcodebuild.log
          fi
      - name: Report XCTest durations
        if: always()
        run: >-
          python .github/scripts/report_xcode_test_durations.py
          --input-log artifacts/xcodebuild.log
          --json-output "artifacts/test-durations-${{ github.event.inputs.suite || 'full-gallery' }}.json"
          --summary "$GITHUB_STEP_SUMMARY"
      - name: Export simulator screenshot attachments
        if: always()
        run: |
          if [ -d artifacts/frontend.xcresult ]; then
            xcrun xcresulttool export attachments \
              --path artifacts/frontend.xcresult \
              --output-path artifacts/raw-cook-with-pip-screenshots
          else
            echo "No xcresult bundle was produced." >&2
            exit 1
          fi
      - name: Organize and verify screenshots for the selected suite
        if: ${{ always() && github.event.inputs.suite == 'toggle-regressions' }}
        run: >-
          python .github/scripts/organize_ios_screenshots.py
          --input artifacts/raw-cook-with-pip-screenshots
          --output artifacts/cook-with-pip-screenshots
          --required .github/scripts/required_ios_toggle_regressions.json
          --only-required
          --commit-sha "$GITHUB_SHA"
          --test-outcome "${{ steps.ios-tests.outcome }}"
      - name: Organize and verify shopping recovery screenshots
        if: ${{ always() && github.event.inputs.suite == 'shopping-recovery' }}
        run: >-
          python .github/scripts/organize_ios_screenshots.py
          --input artifacts/raw-cook-with-pip-screenshots
          --output artifacts/cook-with-pip-screenshots
          --required .github/scripts/required_ios_shopping_recovery_regressions.json
          --only-required
          --commit-sha "$GITHUB_SHA"
          --test-outcome "${{ steps.ios-tests.outcome }}"
      - name: Organize and verify all 55 required screenshots
        if: ${{ always() && github.event.inputs.suite != 'toggle-regressions' && github.event.inputs.suite != 'shopping-recovery' }}
        run: >-
          python .github/scripts/organize_ios_screenshots.py
          --input artifacts/raw-cook-with-pip-screenshots
          --output artifacts/cook-with-pip-screenshots
          --required .github/scripts/required_ios_screenshots.json
          --commit-sha "$GITHUB_SHA"
          --test-outcome "${{ steps.ios-tests.outcome }}"
      - name: Package selected screenshots for review
        if: always()
        run: |
          if [ -d artifacts/cook-with-pip-screenshots ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              artifacts/cook-with-pip-screenshots \
              artifacts/cook-with-pip-visual-gallery.zip
          else
            echo "Organized screenshot folder is missing." >&2
            exit 1
          fi
      - name: Upload screenshot review ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-${{ github.event.inputs.suite || 'full-gallery' }}-review
          path: artifacts/cook-with-pip-visual-gallery.zip
          if-no-files-found: error
      - name: Upload organized screenshots and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-${{ github.event.inputs.suite || 'full-gallery' }}-screenshots
          path: artifacts/cook-with-pip-screenshots
          if-no-files-found: error
      - name: Upload full Xcode result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-${{ github.event.inputs.suite || 'full-gallery' }}-xcresult
          path: artifacts/frontend.xcresult
          if-no-files-found: error
          compression-level: 0
      - name: Upload full XCTest timing report and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cook-with-pip-${{ github.event.inputs.suite || 'full-gallery' }}-durations
          path: |
            artifacts/test-durations-${{ github.event.inputs.suite || 'full-gallery' }}.json
            artifacts/xcodebuild.log
          if-no-files-found: warn
