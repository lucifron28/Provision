name: Provision staging live DeepSeek smoke

on:
  workflow_dispatch:
    inputs:
      expected_render_commit:
        description: Full commit SHA currently deployed to Render staging
        required: true
        type: string
      live_confirmation:
        description: Type RUN_ONE_SYNTHETIC_DEEPSEEK_REQUEST to authorize exactly one provider request
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: provision-staging-e2e
  cancel-in-progress: false

jobs:
  live-smoke:
    if: ${{ inputs.live_confirmation == 'RUN_ONE_SYNTHETIC_DEEPSEEK_REQUEST' }}
    name: One confirmed synthetic provider request
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      PROVISION_EXPECTED_RENDER_COMMIT: ${{ inputs.expected_render_commit }}
      PROVISION_STAGING_API_BASE_URL: ${{ vars.PROVISION_STAGING_API_BASE_URL }}
      PROVISION_LIVE_DEEPSEEK_CONFIRMATION: ${{ inputs.live_confirmation }}
      PROVISION_LIVE_DEEPSEEK_ENABLED: ${{ vars.PROVISION_LIVE_DEEPSEEK_ENABLED }}
    steps:
      - name: Require explicit live testing enablement
        shell: bash
        env:
          PROVISION_LIVE_DEEPSEEK_ENABLED: ${{ vars.PROVISION_LIVE_DEEPSEEK_ENABLED }}
        run: |
          if [[ "$PROVISION_LIVE_DEEPSEEK_ENABLED" != "true" ]]; then
            echo "Set PROVISION_LIVE_DEEPSEEK_ENABLED=true only after staging validation." >&2
            exit 1
          fi

      - name: Check out the requested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_render_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the requested source revision
        shell: bash
        run: |
          [[ "$PROVISION_EXPECTED_RENDER_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Enter a full 40-character commit SHA." >&2
            exit 1
          }
          actual="$(git rev-parse HEAD)"
          expected="${PROVISION_EXPECTED_RENDER_COMMIT,,}"
          [[ "$actual" == "$expected" ]] || {
            echo "Checked out $actual, expected $expected." >&2
            exit 1
          }
          git merge-base --is-ancestor "$actual" refs/remotes/origin/main || {
            echo "The live smoke only accepts commits reachable from approved main." >&2
            exit 1
          }

      - name: Set up Python and uv
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
          python-version: "3.13"

      - name: Install locked backend runtime dependencies
        working-directory: backend
        run: uv sync --frozen --no-dev --no-install-project

      - name: Verify Render staging target and deployed commit
        working-directory: backend
        run: uv run --no-sync python scripts/staging_e2e_smoke.py preflight

      - name: Create a unique synthetic, consentable household
        id: staging-fixture
        working-directory: backend
        env:
          PROVISION_STAGING_FIXTURE_TOKEN: ${{ secrets.PROVISION_STAGING_FIXTURE_TOKEN }}
        run: uv run --no-sync python scripts/staging_e2e_smoke.py prepare

      - name: Run one live request and validate its response
        working-directory: backend
        run: uv run --no-sync python scripts/staging_live_deepseek_smoke.py

      - name: Remove the run-owned synthetic household
        if: always() && steps.staging-fixture.outcome == 'success'
        working-directory: backend
        env:
          PROVISION_STAGING_FIXTURE_TOKEN: ${{ secrets.PROVISION_STAGING_FIXTURE_TOKEN }}
        run: uv run --no-sync python scripts/staging_e2e_smoke.py cleanup
