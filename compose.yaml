services:
  postgres:
    image: postgres:18
    container_name: provision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-provision}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-provision}
      POSTGRES_DB: ${POSTGRES_DB:-provision}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-provision} -d ${POSTGRES_DB:-provision}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  postgres_data:
    name: provision_postgres_data
